# Fetch, serve, run, close and delete a model as an Apptainer image, on a
# Linux runner where Docker is not used.

name: Test Apptainer models

on:
  pull_request:
    branches: [master]
    paths:
      - "ersilia/utils/apptainer.py"
      - "ersilia/setup/requirements/apptainer.py"
      - "ersilia/hub/fetch/**"
      - "ersilia/serve/**"
      - "ersilia/hub/delete/**"
      - ".github/workflows/test-apptainer.yml"
  workflow_dispatch:

jobs:
  apptainer:
    runs-on: ubuntu-latest
    env:
      MODEL_ID: eos4e40
    steps:
      - uses: actions/checkout@v6.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Install Ersilia
        run: pip install -e .

      - name: Stop Docker, to be sure it is not used
        run: sudo systemctl stop docker.socket docker.service || true

      - name: Fetch
        run: ersilia -v fetch $MODEL_ID --from_apptainer

      - name: Check the image and the model folder
        run: |
          ls -la ~/eos/sifs
          test -n "$(ls ~/eos/sifs/${MODEL_ID}_v*.sif)"
          cat ~/eos/dest/$MODEL_ID/from_apptainer.json
          grep -q Apptainer ~/eos/dest/$MODEL_ID/model_source.txt

      - name: Fetching again reuses the image on disk
        run: |
          # Forget the model but keep its image, then fetch it again.
          rm -rf ~/eos/dest/$MODEL_ID ~/eos/repository/$MODEL_ID
          ersilia fetch $MODEL_ID --from_apptainer 2>&1 | tee refetch.log
          grep -q "already downloaded" refetch.log

      - name: Serve, run and close
        run: |
          ersilia serve $MODEL_ID
          ersilia example -n 5 -o input.csv
          ersilia run -i input.csv -o output.csv
          cat output.csv
          test "$(wc -l < output.csv)" -eq 6
          ersilia close
          sleep 2
          if pgrep -f run_uvicorn; then echo "A model server survived close"; exit 1; fi

      - name: Delete
        run: |
          ersilia delete $MODEL_ID
          test -z "$(ls ~/eos/sifs/${MODEL_ID}_v*.sif 2>/dev/null)"

      - name: ERSILIA_SIF_DIR moves the images
        env:
          ERSILIA_SIF_DIR: ${{ runner.temp }}/sifs
        run: |
          ersilia fetch $MODEL_ID --from_apptainer
          test -n "$(ls $ERSILIA_SIF_DIR/${MODEL_ID}_v*.sif)"
          ersilia delete $MODEL_ID
