# Fetch, serve, run, close and delete a model as an Apptainer image, on a
# Linux runner where Docker is not used. On macOS, where Apptainer cannot run,
# check that Ersilia says so cleanly and skip the rest.

name: Test Apptainer models

on:
  pull_request:
    branches: [master]
    paths:
      - "ersilia/utils/apptainer.py"
      - "ersilia/setup/requirements/apptainer.py"
      - "ersilia/hub/fetch/**"
      - "ersilia/serve/**"
      - "ersilia/hub/delete/**"
      - "ersilia/utils/session.py"
      - ".github/workflows/test-apptainer.yml"
  workflow_dispatch:

jobs:
  apptainer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MODEL_ID: eos4e40
    steps:
      - uses: actions/checkout@v6.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ersilia
        run: pip install -e .

      # macOS: Apptainer runs on Linux only.

      - name: On macOS, fetching as an Apptainer image fails cleanly
        if: runner.os == 'macOS'
        run: |
          set +e
          ersilia fetch $MODEL_ID --from_apptainer > out.txt 2> err.txt
          code=$?
          set -e
          cat out.txt err.txt
          test $code -eq 1
          grep -q "can only be run on Linux, not on macOS" err.txt
          grep -q "leave out --from_apptainer" err.txt
          if grep -qE "Traceback|Task exception" out.txt err.txt; then echo "Not a clean error"; exit 1; fi
          test ! -d ~/eos/dest/$MODEL_ID
          echo "Apptainer is not available on macOS: the Linux steps are skipped."

      # Linux: the whole life of a model, without Docker.

      - name: Install Apptainer
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Stop Docker, to be sure it is not used
        if: runner.os == 'Linux'
        run: sudo systemctl stop docker.socket docker.service || true

      - name: Fetch
        if: runner.os == 'Linux'
        run: ersilia -v fetch $MODEL_ID --from_apptainer

      - name: Check the image and the model folder
        if: runner.os == 'Linux'
        run: |
          ls -la ~/eos/sifs
          test -n "$(ls ~/eos/sifs/${MODEL_ID}_v*.sif)"
          cat ~/eos/dest/$MODEL_ID/from_apptainer.json
          grep -q Apptainer ~/eos/dest/$MODEL_ID/model_source.txt

      - name: Fetching leaves no model server behind
        if: runner.os == 'Linux'
        run: |
          if pgrep -af "run_uvicorn|ersilia_model_serve"; then echo "A model server survived fetch"; exit 1; fi

      - name: Fetching again reuses the image on disk
        if: runner.os == 'Linux'
        run: |
          # Forget the model but keep its image, then fetch it again.
          rm -rf ~/eos/dest/$MODEL_ID ~/eos/repository/$MODEL_ID
          ersilia fetch $MODEL_ID --from_apptainer 2>&1 | tee refetch.log
          grep -q "already downloaded" refetch.log

      - name: Serve, run and close
        if: runner.os == 'Linux'
        run: |
          ersilia serve $MODEL_ID
          ersilia example -n 5 -o input.csv
          ersilia run -i input.csv -o output.csv
          cat output.csv
          test "$(wc -l < output.csv)" -eq 6
          ersilia close
          sleep 2
          if pgrep -af "run_uvicorn|ersilia_model_serve"; then echo "A model server survived close"; exit 1; fi

      - name: Delete
        if: runner.os == 'Linux'
        run: |
          ersilia delete $MODEL_ID
          test -z "$(ls ~/eos/sifs/${MODEL_ID}_v*.sif 2>/dev/null)"

      - name: ERSILIA_SIF_DIR moves the images
        if: runner.os == 'Linux'
        env:
          ERSILIA_SIF_DIR: ${{ runner.temp }}/sifs
        run: |
          ersilia fetch $MODEL_ID --from_apptainer
          test -n "$(ls $ERSILIA_SIF_DIR/${MODEL_ID}_v*.sif)"
          ersilia delete $MODEL_ID
